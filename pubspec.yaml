name: sayno
description: SayNO - Digital Discipline Platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.5.5
  youtube_player_iframe: ^4.0.0
  google_sign_in: ^6.2.1
  http: ^1.2.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.5
  clock: any
  fake_async: any

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/illustrations/
    - assets/animations/
    - assets/data/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "public/brand/icon-512.png.png"
  min_sdk_android: 24
